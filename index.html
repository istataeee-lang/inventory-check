<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventory Check - Charn</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f1;--card:#ffffff;--ink:#3b2417;--mute:#8a6f5c;--line:#e8dccf;--main:#6b4226;--main-ink:#ffffff;--soft:#f1e7dc;--ok:#3f7d4e;--warn:#b4400f;--warn-bg:#fbe8db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1510;--card:#2a1e17;--ink:#f5ece3;--mute:#b79d88;--line:#42312580;--main:#c9a07a;--main-ink:#1e1510;--soft:#3a2a20;--ok:#7fcf94;--warn:#ffb27a;--warn-bg:#4a2a18}}
:root[data-theme="dark"]{--bg:#1e1510;--card:#2a1e17;--ink:#f5ece3;--mute:#b79d88;--line:#423125;--main:#c9a07a;--main-ink:#1e1510;--soft:#3a2a20;--ok:#7fcf94;--warn:#ffb27a;--warn-bg:#4a2a18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt',Tahoma,sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.brand{font-size:20px;font-weight:600}
.who{font-size:14px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.tabs button{flex:none}
button,input,select{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input:focus,textarea:focus,button:focus-visible,select:focus{outline:2px solid var(--main);outline-offset:1px}
button{padding:10px 16px;border:0;border-radius:10px;background:var(--soft);cursor:pointer;font-weight:500}
button.pri{background:var(--main);color:var(--main-ink)}
button.on{background:var(--main);color:var(--main-ink)}
button.del{background:var(--warn-bg);color:var(--warn)}
.row{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:10px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center;font-size:14px}
th{color:var(--mute);font-weight:500}
td:nth-child(2),th:nth-child(2){text-align:left}
td input{width:76px;text-align:center;padding:8px}
.used{font-weight:600}
.low{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:2px 8px;font-size:12px}
.ok{color:var(--ok)}
.hidden{display:none}
.msg{color:var(--warn);min-height:22px;font-size:14px}
.login{max-width:380px;margin:8vh auto 0}
.hint{font-size:13px;color:var(--mute)}
.code,.code1{white-space:nowrap;font-size:12px}
.code{font-weight:600;border-radius:8px}
td select{width:auto;padding:6px 8px}
input[type=checkbox]{width:18px;height:18px;padding:0;margin:0}
button:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px}
.datebox{display:inline-block;padding:10px 14px;border-radius:10px;background:var(--soft);font-weight:500}
#modal{position:fixed;inset:0;background:rgba(30,20,14,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.hidden{display:none}
#modal .dlg{background:var(--card);color:var(--ink);border-radius:14px;padding:20px;max-width:380px;width:100%}
#modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">

<div id="login" class="card login">
  <h1>🧋 Inventory Check - Charn</h1>
  <p class="hint">ระบบตรวจนับสต็อกร้านชานม</p>
  <input id="u" placeholder="ชื่อผู้ใช้" autocomplete="username">
  <div style="height:8px"></div>
  <input id="p" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
  <div class="msg" id="lmsg"></div>
  <button class="pri" style="width:100%" onclick="login()">เข้าสู่ระบบ</button>
  <p class="hint">ลืมรหัสผ่านหรืออยากเปลี่ยนรหัส ให้ติดต่อผู้จัดการหรือผู้ดูแลระบบ</p>
</div>

<div id="app" class="hidden">
  <div class="top">
    <div><div class="brand">🧋 Inventory Check - Charn <span id="month" style="font-weight:400;color:var(--mute)"></span></div><div class="who" id="who"></div></div>
    <button onclick="logout()">ออกจากระบบ</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

</div>
<div id="modal" class="hidden"></div>
<script>
const KEY='sbts_v12';
const ROLES={admin:'ผู้ดูแลระบบ',manager:'ผู้จัดการ',employee:'พนักงาน'};
const GROUPS={raw:'วัตถุดิบ (นับทุกวัน)',supply:'วัสดุสิ้นเปลือง (นับสิ้นเดือน)'};
const COLORS={red:['ชมพู','#E8ABB5','#3b2417'],yellow:['เบจ','#ECDBC9','#3b2417'],green:['เขียวอ่อน','#ADD495','#3b2417'],dark:['เทาเข้ม','#2E3136','#ffffff']}; // สีแรก (key red) แสดงให้พนักงาน
const BUFFER=0.2;
let S=load(),me=null,tab='count',draft={},hMonth='',cFilter='all',orderDays=7;

function load(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!d||!d.users)d={
    users:[{u:'ADMIN01',p:'ADMIN01',name:'Admin',role:'admin'},{u:'MNG01',p:'MNG01',name:'Manager',role:'manager'},{u:'EMP001',p:'0000',name:'พนักงาน 1',role:'employee'}],
    products:[{id:'PM-00176',name:'ถุงหิ้วเก็บความเย็น 1 แก้ว (1ลัง@500ชิ้น)',unit:'ลัง',min:3,last:10}],history:[]};
  d.products.forEach(p=>{p.group=p.group||'raw';p.color=p.color||'';p.recv=p.recv||0;p.min=p.min||0});
  d.receipts=d.receipts||[];d.history=d.history||[];
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const r1=v=>Math.round(v*10)/10;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const thDate=ds=>{const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})};
const thMonth=ds=>{const [y,m]=ds.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})};
const isMonthEnd=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()===d.getDate()};
function tick(){const m=$('month');if(m)m.textContent='· '+thMonth(today());const c=$('cdate');if(c)c.textContent=thDate(today());const rc=$('rdate');if(rc)rc.textContent=thDate(today())}
setInterval(tick,30000);
const codeCell=p=>{const c=COLORS[p.color];return `<td class="code" ${c?`style="background:${c[1]};color:${c[2]}"`:''}>${esc(p.id)}</td>`};
const mine=h=>h.uid?h.uid===me.u:h.by===me.name;
function latest(id){for(const h of S.history){const i=h.items.find(x=>x.id===id);if(i)return {...i,date:h.date}}return null}

function login(){
  const u=$('u').value.trim(),p=$('p').value;
  const f=S.users.find(x=>x.u===u&&x.p===p);
  if(!f){$('lmsg').textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';return}
  me=f;tab=f.role==='employee'?'count':'order';
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('who').textContent=f.name+' · '+ROLES[f.role];
  render();
}
function logout(){me=null;$('u').value='';$('p').value='';$('lmsg').textContent='';$('app').classList.add('hidden');$('login').classList.remove('hidden')}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&me===null&&!$('login').classList.contains('hidden'))login()});

function render(){
  const T=[];
  if(me.role==='employee')T.push(['count','📦 ตรวจนับ'],['data','📋 ข้อมูลการลงจำนวนสินค้า'],['history','🕘 ประวัติของฉัน']);
  else{
    T.push(['order','🛒 คำนวณสั่งซื้อ'],['receive','📥 รับเข้าสินค้า']);
    if(me.role==='admin')T.push(['products','🗂️ สินค้า'],['assign','🎨 กลุ่มและสี']);
    T.push(['history','🕘 ประวัติ'],['users','👥 พนักงาน'],['account','🔑 รหัสผ่านของฉัน']);
  }
  if(!T.some(t=>t[0]===tab))tab=T[0][0];
  $('tabs').innerHTML=T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
  tick();
  ({count:vCount,data:vData,order:vOrder,receive:vReceive,products:vProducts,assign:vAssign,history:vHistory,users:vUsers,account:vAccount})[tab]();
  tick();
}
function go(t){tab=t;render()}

/* ---- count (employee) ---- */
const todayItem=id=>{const h=S.history.find(x=>x.date===today());return h&&h.items.find(i=>i.id===id)};
function baseOf(p){const e=todayItem(p.id);return e?{prev:e.prev,inn:e.in+(p.recv||0)}:{prev:p.last-(p.recv||0),inn:p.recv||0}}
function countTable(g,locked){
  const list=S.products.filter(p=>p.group===g);
  if(!list.length)return '<p class="hint">ยังไม่มีรายการในกลุ่มนี้ ผู้ดูแลระบบกำหนดได้ที่แท็บ "กลุ่มและสี"</p>';
  const rows=list.map(p=>{
    const b=baseOf(p),e=todayItem(p.id),d=draft[p.id]||{remain:e?e.remain:''};
    return `<tr data-id="${esc(p.id)}">${codeCell(p)}<td>${esc(p.name)}</td><td>${esc(p.unit)}</td><td>${r1(b.prev)}</td><td>${r1(b.inn)}</td>
    <td><input type="number" min="0" step="any" inputmode="decimal" ${locked?'disabled':''} value="${esc(d.remain)}" oninput="upd('${esc(p.id)}')" aria-label="คงเหลือ ${esc(p.name)}"></td>
    <td class="used" id="used-${esc(p.id)}">-</td><td id="st-${esc(p.id)}"></td></tr>`}).join('');
  return `<div class="scroll"><table><tr><th>รหัส</th><th>รายการ</th><th>หน่วย</th><th>ยอดเมื่อวาน</th><th>รับเข้า</th><th>คงเหลือ</th><th>ใช้ไป</th><th>สถานะ</th></tr>${rows}</table></div>`;
}
function vCount(){
  if(!S.products.length){$('view').innerHTML='<div class="card">ยังไม่มีสินค้า ให้ผู้ดูแลระบบเพิ่มสินค้าก่อน</div>';return}
  const end=isMonthEnd();
  $('view').innerHTML=`<div class="card"><h2>ตรวจนับสินค้า</h2><p class="hint">วันที่นับ (ตามวันที่ในเครื่องของคุณ)</p><div class="datebox" id="cdate"></div>
  <p class="hint">แบ่งนับเป็น 2 รอบ บันทึกแยกกันได้ ไม่บังคับนับครบ แต่ก่อนบันทึกระบบจะแจ้งรายการที่ยังไม่ได้นับให้ยืนยัน</p></div>
  <div class="card"><h3>รอบที่ 1 · วัตถุดิบ (นับทุกวัน)</h3>${countTable('raw',false)}<div class="msg" id="cmsg-raw"></div><button class="pri" onclick="saveCount('raw')">บันทึกรอบที่ 1</button></div>
  <div class="card"><h3>รอบที่ 2 · วัสดุสิ้นเปลือง (นับวันสุดท้ายของเดือน)</h3>${end?'':'<p class="hint">วันนี้ยังไม่ต้องนับ ระบบจะเปิดให้กรอกในวันสุดท้ายของเดือน</p>'}${countTable('supply',!end)}<div class="msg" id="cmsg-supply"></div><button class="pri" ${end?'':'disabled'} onclick="saveCount('supply')">บันทึกรอบที่ 2</button></div>`;
  S.products.forEach(p=>upd(p.id));
}
function upd(id){
  const tr=document.querySelector(`tr[data-id="${CSS.escape(id)}"]`);if(!tr)return;
  const inp=tr.querySelector('input');if(inp.disabled)return;
  draft[id]={remain:inp.value};
  const p=S.products.find(x=>x.id===id),b=baseOf(p),filled=inp.value!=='';
  const used=b.prev+b.inn-num(inp.value);
  $('used-'+id).textContent=filled?r1(used):'-';
  const st=$('st-'+id);
  if(!filled)st.innerHTML='';
  else if(used<0)st.innerHTML='<span class="low">ตรวจยอดอีกครั้ง</span>';
  else if(num(inp.value)<=p.min)st.innerHTML='<span class="low">ใกล้หมด</span>';
  else st.innerHTML='<span class="ok">ปกติ</span>';
}
function saveCount(g){
  if(g==='supply'&&!isMonthEnd())return;
  const list=S.products.filter(p=>p.group===g);
  const val=p=>{const d=draft[p.id];return d&&d.remain!==undefined?d.remain:(todayItem(p.id)||{}).remain};
  const filled=p=>{const v=val(p);return v!==''&&v!==undefined};
  const done=list.filter(filled),miss=list.filter(p=>!filled(p)),msg=$('cmsg-'+g);
  if(!done.length){msg.textContent='ยังไม่ได้กรอกยอดคงเหลือของรายการใด';return}
  for(const p of done){const b=baseOf(p);if(b.prev+b.inn-num(val(p))<0){msg.textContent='คงเหลือของ "'+p.name+'" มากกว่ายอดที่ควรมี กรุณานับอีกครั้ง';return}}
  msg.textContent='';
  const go=()=>{
    const items=done.map(p=>{const b=baseOf(p),rem=num(val(p));return {id:p.id,name:p.name,unit:p.unit,group:p.group,prev:b.prev,in:b.inn,remain:rem,used:b.prev+b.inn-rem}});
    const date=today(),ex=S.history.find(h=>h.date===date),ids=new Set(items.map(i=>i.id));
    const merged=(ex?ex.items.filter(i=>!ids.has(i.id)):[]).concat(items);
    items.forEach(i=>{const p=S.products.find(x=>x.id===i.id);p.last=i.remain;p.recv=0;delete draft[i.id]});
    S.history=S.history.filter(h=>h.date!==date);
    S.history.push({date,by:me.name,uid:me.u,items:merged});
    S.history.sort((a,b)=>b.date.localeCompare(a.date));
    save();
    msg.innerHTML='<span class="ok">บันทึก '+items.length+' รายการ วันที่ '+esc(thDate(date))+' แล้ว</span>';
    setTimeout(vCount,1500);
  };
  if(miss.length){
    const shown=miss.slice(0,15).map(p=>'• '+p.id+' '+p.name).join('\n');
    dlg({text:'มีสินค้าที่ยังไม่ได้นับ '+miss.length+' รายการ:\n'+shown+(miss.length>15?'\nและอีก '+(miss.length-15)+' รายการ':'')+'\n\nถ้าถูกต้องกดยืนยัน หรือกลับไปแก้ไขกดแก้ไขต่อ',okLabel:'ยืนยัน',noLabel:'แก้ไขต่อ',onOk:go});
  }else go();
}

/* ---- data entry view (employee, red only) ---- */
function vData(){
  const rows=S.products.filter(p=>p.color==='red').map(p=>({p,l:latest(p.id)}));
  if(!rows.length){$('view').innerHTML='<div class="card">ยังไม่มีรายการที่ต้องลงข้อมูล ผู้ดูแลระบบกำหนดได้ที่แท็บ "กลุ่มและสี"</div>';return}
  const body=rows.map(({p,l})=>`<tr>${codeCell(p)}<td>${esc(p.name)}</td><td>${esc(p.unit)}</td><td class="used">${l?r1(l.remain):'-'}</td><td>${l?esc(thDate(l.date)):'ยังไม่ได้นับ'}</td></tr>`).join('');
  $('view').innerHTML=`<div class="card"><h2>ข้อมูลการลงจำนวนสินค้า</h2>
  <p class="hint">จำนวนที่นับล่าสุดของรายการที่ต้องนำไปลงในระบบอีกที่</p>
  <div class="scroll"><table><tr><th>รหัส</th><th>รายการ</th><th>หน่วย</th><th>จำนวนที่นับ</th><th>วันที่นับ</th></tr>${body}</table></div>
  <div class="msg" id="dmsg"></div><button class="pri" onclick="copyData()">คัดลอกรหัสและจำนวน</button></div>`;
}
function copyData(){
  const t=S.products.filter(p=>p.color==='red').map(p=>{const l=latest(p.id);return p.id+'\t'+(l?l.remain:'')}).join('\n');
  const done=()=>{$('dmsg').innerHTML='<span class="ok">คัดลอกแล้ว วางใน Excel หรือระบบอื่นได้เลย</span>'};
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){$('dmsg').textContent='คัดลอกไม่ได้ ให้เลือกและคัดลอกจากตารางเอง'}a.remove()};
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,fb);else fb();
}

/* ---- order ---- */
function orderRows(){
  const recent=S.history.slice(0,14);
  return S.products.map(p=>{
    const u=recent.map(h=>h.items.find(i=>i.id===p.id)).filter(Boolean);
    const n=u.length,avg=n?u.reduce((a,i)=>a+i.used,0)/n:0,need=avg*orderDays,base=Math.max(0,need-p.last),fin=Math.ceil(base*(1+BUFFER));
    return `<tr>${codeCell(p)}<td>${esc(p.name)}</td><td>${esc(p.unit)}</td><td>${r1(p.last)}</td><td>${n?r1(avg):'-'}</td><td>${n?r1(need):'-'}</td><td>${n?r1(base):'-'}</td><td class="used">${n?(fin>0?fin:'<span class="ok">ไม่ต้องสั่ง</span>'):'<span class="hint">ยังไม่มีประวัติ</span>'}</td></tr>`}).join('');
}
function vOrder(){
  if(!S.products.length){$('view').innerHTML='<div class="card">ยังไม่มีสินค้า ให้ผู้ดูแลระบบเพิ่มสินค้าก่อน</div>';return}
  $('view').innerHTML=`<div class="card"><h2>คำนวณสินค้าที่ต้องสั่ง</h2>
  <div class="row"><div><label class="hint">สั่งให้พอใช้กี่วัน</label><input type="number" min="1" value="${orderDays}" oninput="orderDays=Math.max(1,num(this.value));$('otable').innerHTML=oTable()"></div></div>
  <p class="hint">ต้องสั่ง = ใช้เฉลี่ยต่อวัน × จำนวนวัน − สต็อกตอนนี้ แล้วเผื่อเพิ่ม 20% จากยอดสั่ง ปัดขึ้นเป็นจำนวนเต็ม (ใช้เฉลี่ยจากประวัติตรวจนับล่าสุดไม่เกิน 14 ครั้ง)</p>
  <div class="scroll" id="otable">${oTable()}</div></div>`;
}
const oTable=()=>`<table><tr><th>รหัส</th><th>รายการ</th><th>หน่วย</th><th>สต็อกตอนนี้</th><th>ใช้เฉลี่ย/วัน</th><th>ต้องใช้</th><th>ต้องสั่ง</th><th>สั่งจริง (+20%)</th></tr>${orderRows()}</table>`;

/* ---- receive ---- */
function applyReceive(items){
  items.forEach(i=>{const p=S.products.find(x=>x.id===i.id);p.last+=i.qty;p.recv=(p.recv||0)+i.qty});
  S.receipts.unshift({date:today(),by:me.name,items:items.map(i=>{const p=S.products.find(x=>x.id===i.id);return {id:p.id,name:p.name,unit:p.unit,qty:i.qty}})});

function pasteReceive(){
  const items=[],unknown=[];
  $('rpaste').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{

let sel=new Set();
function selUpd(){const n=sel.size,t=S.products.length,b=$('bulkdel'),a=$('selall');if(b){b.textContent='ลบที่เลือก ('+n+')';b.disabled=!n}if(a){a.checked=n>0&&n===t;a.indeterminate=n>0&&n<t}}
function togSel(el){el.checked?sel.add(el.dataset.id):sel.delete(el.dataset.id);selUpd()}
function togAll(el){document.querySelectorAll('.pchk').forEach(c=>{c.checked=el.checked;el.checked?sel.add(c.dataset.id):sel.delete(c.dataset.id)});selUpd()}
function delSelected(){
  const ids=[...sel];if(!ids.length)return;
  dlg({text:'ลบสินค้าที่เลือก '+ids.length+' รายการ ? ประวัติเดิมยังอยู่',danger:true,okLabel:'ลบ',onOk:()=>{S.products=S.products.filter(p=>!sel.has(p.id));ids.forEach(id=>delete draft[id]);sel.clear();save();vProducts()}});

const groupWord=t=>{t=(t||'').trim();if(/^(วัสดุสิ้นเปลือง|วัสดุ)$/.test(t)||/^supply$/i.test(t))return 'supply';if(t==='วัตถุดิบ'||/^raw$/i.test(t))return 'raw';return null};
function colorWord(t){t=(t||'').trim();if(/^(ไม่มีสี|ไม่กำหนด|-)$/.test(t))return '';
  for(const [k,v] of Object.entries(COLORS)){if(t.toLowerCase()===v[1].toLowerCase()||t===v[0]||t===v[0].replace('อ่อน','').replace('เข้ม',''))return k}
  if(/^(เทา|ดำ)$/.test(t))return 'dark';return undefined}
const linesOf=id=>$(id).value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
function importProducts(){
  const lines=linesOf('paste');
  let g=null;
  if(lines.length&&groupWord(lines[lines.length-1]))g=groupWord(lines.pop());
  let added=0,upd_=0;const order=[],bad=[];
  const isN=v=>v===undefined||v===''||/^\d+(\.\d+)?$/.test(v);
  lines.forEach((line,idx)=>{
    const fail=why=>bad.push({n:idx+1,line,why});
    let c;
    if(line.includes('\t'))c=line.split('\t');
    else if(line.includes(','))c=line.split(',');
    else{const m=line.match(/^(\S+)\s+(.+?)\s+(\S+)$/);c=m?[m[1],m[2],m[3]]:null}
    if(!c){fail(groupWord(line)?'ชื่อกลุ่มต้องอยู่บรรทัดสุดท้ายเท่านั้น':'แยกช่องไม่ได้ ให้คั่นด้วย Tab หรือจุลภาค (,) และมีอย่างน้อย รหัส, ชื่อรายการ, หน่วย');return}
    c=c.map(x=>x.trim());
    if(c[0]==='รหัส'||/^code$/i.test(c[0]))return;
    const miss=['รหัส','ชื่อรายการ','หน่วย'].filter((_,i)=>!c[i]);
    if(miss.length){fail('ไม่มี '+miss.join(', ')+' (พบ '+c.filter(Boolean).length+' ช่อง ต้องมีอย่างน้อย 3 ช่อง)');return}
    if(!isN(c[3])){fail('ยอดเริ่มต้น "'+c[3]+'" ไม่ใช่ตัวเลข (ช่องที่ 4)');return}
    if(!isN(c[4])){fail('จุดแจ้งเตือน "'+c[4]+'" ไม่ใช่ตัวเลข (ช่องที่ 5)');return}
    let p=S.products.find(x=>x.id===c[0]);
    if(p){p.name=c[1];p.unit=c[2];if(g)p.group=g;if(c[3]!==undefined&&c[3]!=='')p.last=num(c[3]);if(c[4]!==undefined&&c[4]!=='')p.min=num(c[4]);if(!order.includes(p.id))upd_++}
    else{p={id:c[0],name:c[1],unit:c[2],group:g||'raw',color:'',min:num(c[4]),last:num(c[3]),recv:0};S.products.push(p);added++}
    if(!order.includes(p.id))order.push(p.id);
  });
  S.products=order.map(id=>S.products.find(p=>p.id===id)).concat(S.products.filter(p=>!order.includes(p.id)));
  save();vProducts();
  const gl=g?(g==='raw'?'วัตถุดิบ':'วัสดุสิ้นเปลือง'):'ไม่ได้ระบุ (รายการใหม่ใช้วัตถุดิบ)';
  let h=`<span class="${added+upd_?'ok':''}">เพิ่มใหม่ ${added} · อัปเดต ${upd_} · อ่านไม่ได้ ${bad.length} · กลุ่ม: ${gl}</span>`;
  if(bad.length){
    h+=`<div class="msg" style="margin-top:6px"><b>บรรทัดที่อ่านไม่ได้ (ไม่ได้เพิ่ม):</b><ul style="margin:4px 0 0;padding-left:20px">${bad.map(x=>`<li>บรรทัดที่ ${x.n}: <code>${esc(x.line)}</code><br>สาเหตุ: ${esc(x.why)}</li>`).join('')}</ul><div class="hint">ใส่บรรทัดเหล่านี้กลับในช่องวางให้แล้ว แก้ไขแล้วกดอัปเดตอีกครั้งได้เลย</div></div>`;
    $('paste').value=bad.map(x=>x.line).join('\n')+(g?'\n'+(g==='raw'?'วัตถุดิบ':'วัสดุสิ้นเปลือง'):'');
  }
  $('imsg').innerHTML=h;
}
function addProduct(){
  const id=$('pid').value.trim(),name=$('pname').value.trim(),unit=$('punit').value.trim();
  if(!id||!name||!unit){$('pmsg').textContent='กรอกรหัส ชื่อรายการ และหน่วยให้ครบ';return}

  S.products.push({id,name,unit,group:$('pgroup').value,color:'',min:num($('pmin').value),last:num($('pstart').value),recv:0});
  save();vProducts();
}

    <td>${r1(p.last)}</td><td>${l?r1(l.prev+l.in):'-'}</td><td>${l?r1(l.remain):'-'}</td><td>${l?r1(l.used):'-'}</td><td>${st}</td><td>${l?esc(thDate(l.date)):'-'}</td></tr>`}).join('');
  $('view').innerHTML=`<div class="card"><h2>กำหนดกลุ่มและสีทีเดียว</h2>
  <p class="hint">วางรหัสสินค้าทีละบรรทัด แล้วพิมพ์บรรทัดสุดท้ายเป็นกลุ่ม (วัตถุดิบ หรือ วัสดุสิ้นเปลือง) หรือสี (${Object.values(COLORS).map(v=>v[0]).join(' / ')} หรือรหัสสี เช่น #E8ABB5) หรือทั้งสองอย่างเป็นสองบรรทัดท้าย ระบบจะกำหนดให้ทุกรหัสที่วางในครั้งเดียว ถ้าพิมพ์ว่า ไม่มีสี จะเป็นการล้างสี</p>
  <textarea id="apaste" rows="6" placeholder="PM-00176&#10;PM-00177&#10;วัสดุสิ้นเปลือง&#10;ชมพู"></textarea>
  <div class="msg" id="amsg2"></div><button class="pri" onclick="applyAssign()">กำหนดตามที่วาง</button></div>
  <div class="card"><h2>กลุ่มและสี</h2>
  <p class="hint">สีแรก (ชมพู) แสดงให้พนักงานในแท็บ "ข้อมูลการลงจำนวนสินค้า" ส่วนสีอื่นเห็นเฉพาะผู้ดูแลระบบ ตารางนี้ใช้ตรวจว่าพนักงานนับถูกหรือไม่: เทียบยอดที่ควรมีตามระบบกับยอดที่นับ และเตือนเมื่อนับเกินยอดระบบหรือใช้มากกว่า 2 เท่าของค่าเฉลี่ย</p>
  <div class="tabs">${fl.map(x=>`<button class="${cFilter===x[0]?'on':''}" onclick="cFilter='${x[0]}';vAssign()">${x[1]}</button>`).join('')}</div>
  <div class="scroll"><table style="min-width:980px"><tr><th>รหัส</th><th>รายการ</th><th>หน่วย</th><th>กลุ่ม</th><th>สี</th><th>สต็อกปัจจุบัน</th><th>ยอดตามระบบก่อนนับ</th><th>พนักงานนับ</th><th>ใช้ไป</th><th>ผลตรวจ</th><th>วันที่นับ</th></tr>${rows||'<tr><td colspan="11">ไม่มีรายการ</td></tr>'}</table></div></div>`;
}

function applyAssign(){
  const lines=linesOf('apaste');let g=null,col;
  while(lines.length){const t=lines[lines.length-1],gw=groupWord(t),cw=colorWord(t);
    if(gw&&!g){g=gw;lines.pop()}else if(cw!==undefined&&col===undefined){col=cw;lines.pop()}else break}
  if(!g&&col===undefined){$('amsg2').textContent='พิมพ์บรรทัดสุดท้ายเป็นชื่อกลุ่มหรือสี';return}
  let n=0;const unk=[];
  lines.forEach(l=>{const id=l.split(/[\t,\s]+/)[0],p=S.products.find(x=>x.id===id);if(!p){unk.push(id);return}if(g)p.group=g;if(col!==undefined)p.color=col;n++});
  save();vAssign();
  $('amsg2').innerHTML=`<span class="${n?'ok':''}">กำหนดให้ ${n} รายการแล้ว</span>${unk.length?' <span class="msg">ไม่รู้จักรหัส: '+esc(unk.join(', '))+'</span>':''}`;
}

  if(!all.length){$('view').innerHTML='<div class="card">ยังไม่มีประวัติการตรวจนับ</div>';return}
  const months=[...new Set(all.map(h=>h.date.slice(0,7)))];
  if(!hMonth||!months.includes(hMonth))hMonth=months.includes(today().slice(0,7))?today().slice(0,7):months[0];
  const opts=months.map(m=>`<option value="${m}" ${m===hMonth?'selected':''}>${esc(thMonth(m+'-01'))}</option>`).join('');
  const blocks=all.filter(h=>h.date.startsWith(hMonth)).map(h=>`<div class="card"><h3>${esc(thDate(h.date))} <span class="hint">โดย ${esc(h.by)}</span></h3><div class="scroll"><table>
  <tr><th>รหัส</th><th>รายการ</th><th>หน่วย</th><th>กลุ่ม</th><th>ยอดเมื่อวาน</th><th>รับเข้า</th><th>คงเหลือ</th><th>ใช้ไป</th></tr>
  ${h.items.map(i=>`<tr>${codeCell(S.products.find(x=>x.id===i.id)||{id:i.id})}<td>${esc(i.name)}</td><td>${esc(i.unit)}</td><td>${i.group==='supply'?'วัสดุ':'วัตถุดิบ'}</td><td>${r1(i.prev)}</td><td>${r1(i.in)}</td><td>${r1(i.remain)}</td><td class="used">${r1(i.used)}</td></tr>`).join('')}</table></div></div>`).join('');
  $('view').innerHTML=`<div class="card"><div class="row"><div><label class="hint">เดือน</label><select onchange="hMonth=this.value;vHistory()">${opts}</select></div></div><button class="pri" onclick="exportCsv()">ดาวน์โหลด CSV (เดือนนี้)</button> <span class="hint">เปิดใน Excel ได้</span></div>`+blocks;
}
function exportCsv(){
  const all=me.role==='employee'?S.history.filter(mine):S.history;
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=[['วันที่','ผู้นับ','รหัส','รายการ','หน่วย','กลุ่ม','ยอดเมื่อวาน','รับเข้า','คงเหลือ','ใช้ไป'].map(q).join(',')];
  all.filter(h=>h.date.startsWith(hMonth)).forEach(h=>h.items.forEach(i=>lines.push([h.date,h.by,i.id,i.name,i.unit,i.group==='supply'?'วัสดุสิ้นเปลือง':'วัตถุดิบ',i.prev,i.in,i.remain,i.used].map(q).join(','))));
  const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stock-'+hMonth+'.csv';document.body.appendChild(a);a.click();a.remove();
}

/* ---- users ---- */
const canManage=x=>me.role==='admin'||(me.role==='manager'&&x.role==='employee');
function vUsers(){
  const rows=S.users.map(x=>`<tr><td>${esc(x.u)}</td><td>${esc(x.name)}</td><td>${ROLES[x.role]}</td><td>${canManage(x)?`<button data-id="${esc(x.u)}" onclick="setPw(this.dataset.id)">ตั้งรหัสผ่านใหม่</button> `:''}${canManage(x)&&x.u!==me.u?`<button class="del" data-id="${esc(x.u)}" onclick="delUser(this.dataset.id)">ลบ</button>`:''}</td></tr>`).join('');
  const roleOpts=me.role==='admin'?'<option value="employee">พนักงาน</option><option value="manager">ผู้จัดการ</option><option value="admin">ผู้ดูแลระบบ</option>':'<option value="employee">พนักงาน</option>';
  $('view').innerHTML=`<div class="card"><h2>เพิ่มผู้ใช้</h2>
  <div class="row"><input id="nu" placeholder="ชื่อผู้ใช้"><input id="nn" placeholder="ชื่อที่แสดง"><input id="np" type="text" placeholder="กำหนดรหัสผ่าน"><select id="nr">${roleOpts}</select></div>
  <div class="msg" id="umsg"></div><button class="pri" onclick="addUser()">เพิ่มผู้ใช้</button></div>
  <div class="card"><h2>ผู้ใช้ทั้งหมด</h2><div class="scroll"><table><tr><th>ชื่อผู้ใช้</th><th>ชื่อที่แสดง</th><th>สิทธิ์</th><th></th></tr>${rows}</table></div></div>`;
}
function addUser(){
  const u=$('nu').value.trim(),name=$('nn').value.trim()||u,p=$('np').value;
  if(!u||!p){$('umsg').textContent='กรอกชื่อผู้ใช้และรหัสผ่าน';return}
  if(S.users.some(x=>x.u===u)){$('umsg').textContent='ชื่อผู้ใช้นี้มีอยู่แล้ว';return}
  S.users.push({u,p,name,role:me.role==='admin'?$('nr').value:'employee'});save();vUsers();
}
function setPw(u){
  const x=S.users.find(y=>y.u===u);if(!x||!canManage(x))return;
  dlg({text:'ตั้งรหัสผ่านใหม่ให้ '+u,input:true,okLabel:'บันทึก',onOk:p=>{
    if(!p||p.length<4)return 'รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร';
    x.p=p;save();setTimeout(()=>dlg({text:'ตั้งรหัสผ่านใหม่ให้ '+u+' แล้ว',okOnly:true}),0);
  }});
}
function delUser(u){
  const x=S.users.find(y=>y.u===u);if(!x||!canManage(x))return;
  dlg({text:'ลบผู้ใช้ '+u+' ?',danger:true,okLabel:'ลบ',onOk:()=>{S.users=S.users.filter(y=>y.u!==u);save();vUsers()}});
}

/* ---- account ---- */
function vAccount(){
  $('view').innerHTML=`<div class="card" style="max-width:420px"><h2>เปลี่ยนรหัสผ่าน</h2>
  <input id="op" type="password" placeholder="รหัสผ่านเดิม"><div style="height:8px"></div>
  <input id="npw" type="password" placeholder="รหัสผ่านใหม่"><div class="msg" id="amsg"></div>
  <button class="pri" onclick="chPw()">บันทึกรหัสผ่านใหม่</button></div>`;
}
function chPw(){
  if($('op').value!==me.p){$('amsg').textContent='รหัสผ่านเดิมไม่ถูกต้อง';return}
  if($('npw').value.length<4){$('amsg').textContent='รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร';return}
  me.p=$('npw').value;save();$('amsg').innerHTML='<span class="ok">เปลี่ยนรหัสผ่านแล้ว</span>';
}
</script>
</body>
